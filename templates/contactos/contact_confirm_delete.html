{% extends "base.html" %}

{% block title %}Eliminar Contacto{% endblock %}

{% block extra_styles %}
<style>
    .delete-container {
        max-width: 500px;
        margin: 60px auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    
    .delete-header {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        padding: 40px 30px;
        text-align: center;
    }
    
    .delete-header h2 {
        margin: 0 0 10px 0;
        color: white;
        font-size: 2rem;
    }
    
    .delete-icon {
        font-size: 3rem;
        margin-bottom: 15px;
    }
    
    .delete-body {
        padding: 40px 30px;
        text-align: center;
    }
    
    .contact-name-display {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1f2937;
        margin: 20px 0;
        padding: 15px;
        background-color: #fef2f2;
        border-radius: 8px;
        border-left: 4px solid #ef4444;
    }
    
    .warning-message {
        color: #6b7280;
        font-size: 1.1rem;
        margin: 25px 0;
        line-height: 1.6;
    }
    
    .warning-highlight {
        color: #ef4444;
        font-weight: 600;
    }
    
    .delete-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #e5e7eb;
    }
    
    .btn-action-delete {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    
    .btn-confirm-delete {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
    }
    
    .btn-confirm-delete:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
    }
    
    .btn-cancel-delete {
        background-color: #e5e7eb;
        color: #374151;
    }
    
    .btn-cancel-delete:hover {
        background-color: #d1d5db;
        transform: translateY(-2px);
    }
    
    .alert-box {
        background-color: #fee2e2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }
    
    .alert-icon {
        font-size: 1.3rem;
        flex-shrink: 0;
    }
</style>
{% endblock %}

{% block content %}
<style>
    h2 { color: #856404; margin-bottom: 20px; font-size: 24px; font-weight: 700; text-align: center; }
    p { color: #856404; text-align: center; font-size: 16px; margin-bottom: 20px; }
    form { max-width: 500px; margin: 0 auto; background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%); border: 3px solid #ffc107; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(255, 193, 7, 0.2); display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { padding: 12px 30px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: all 0.3s; box-shadow: 0 4px 12px rgba(108, 117, 125, 0.25); border: none; cursor: pointer; font-size: 14px; }
    a:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(108, 117, 125, 0.35); }
    button { padding: 12px 30px; background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 14px; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.25); }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(220, 53, 69, 0.35); }
</style>

<h2>Eliminar contacto</h2>
<p>¿Seguro que quieres eliminar a {{ object.name }}?</p>
<form method="post">{% csrf_token %}<a href="{% url 'contactos:list' %}">Cancelar</a> <button type="submit">Eliminar</button></form>
{% endblock %}
