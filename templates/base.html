<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Agenda{% endblock %} | Contactos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        header { background: white; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 30px; margin-bottom: 30px; border-left: 6px solid #667eea; }
        header h1 { color: #1a1a2e; margin-bottom: 20px; font-size: 28px; font-weight: 700; }
        header nav { display: flex; gap: 12px; flex-wrap: wrap; }
        header a { padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: all 0.3s; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); cursor: pointer; }
        header a:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }
        main { max-width: 1200px; margin: 0 auto; }
        main > div:not(.content-wrapper) { margin-bottom: 20px; }
        .message { padding: 15px 20px; border-radius: 8px; background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border: 2px solid #c3e6cb; color: #155724; margin-bottom: 12px; font-weight: 500; box-shadow: 0 4px 12px rgba(21, 87, 36, 0.15); }
        .content-wrapper { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body>
    <header>
        <h1>📋 Agenda de contactos</h1>
        <nav>
            <a href="{% url 'contactos:list' %}">🏠 Inicio</a> |
            <a href="{% url 'contactos:create' %}">➕ Agregar contacto</a>
        </nav>
    </header>
    <hr>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
